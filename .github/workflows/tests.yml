name: Installer checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: |
          .\tests\Install.Tests.ps1
          .\tests\Layout.Tests.ps1
          .\tests\Settings.Tests.ps1
      - name: Test with PowerShell 7
        shell: pwsh
        run: |
          .\tests\Install.Tests.ps1
          .\tests\Layout.Tests.ps1
          .\tests\Settings.Tests.ps1
